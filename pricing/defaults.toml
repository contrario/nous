# ---------------------------------------------------------------------
# Self-hosted / open-weights examples
# ---------------------------------------------------------------------

# Self-hosted Llama on user GPU. Per-hour billing, NOT per-token.
# Under --smt, the user must additionally declare expected runtime
# hours per soul (Phase 5c feature). Until then, --smt rejects this
# pricing model with a clear error.
[models."llama-3-3-70b-local"]
provider       = "self-hosted"
pricing_model  = "per_hour"
hourly_cost    = "2.50"
verified_date = "2026-06-29"
source_url    = "https://www.together.ai/pricing"
verified_by   = "estimated"
notes         = "Estimated A100 rental. Per-hour billing not yet SMT-verifiable; see Phase 5c roadmap."


