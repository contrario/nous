[models."gpt-5-2"]
provider       = "openai"
pricing_model  = "per_token"
input_per_1m  = "1.75"
output_per_1m = "14.00"

# OpenAI sets the cached-input rate per model; it is not a fixed share
# of the input rate, so each value is read from the published table.
# OpenAI publishes a cache-write rate for some models only. Where the
# table shows "-" the field is omitted, not derived.
prompt_caching_supported = true
input_cached_per_1m      = "0.175"
batch_discount_pct = 50
reasoning_token_multiplier = "1.0"
verified_date = "2026-09-17"
source_url    = "https://developers.openai.com/api/docs/pricing"
verified_by   = "manual"
notes         = "Standard tier. Verified from developers.openai.com/api/docs/pricing.md fetched on Server A 2026-09-17, sha256 63878741d55c9dc3c928cd88ac8f55399198daedfb49456f816d7d2cbab96768. Fast mode (formerly Priority) bills at a higher published rate and is not bounded by this entry."


