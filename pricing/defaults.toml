# =====================================================================
# NOUS Pricing Table -- defaults.toml
# Schema version 2.0 | Last verified 2026-06-29
# =====================================================================
#
# This file declares the per-token cost of each LLM model that
# NOUS can compile against under --smt. Without this data,
# cost_cap proofs are mathematically impossible.
#
# OVERRIDE PRIORITY (highest wins):
#   1. nous --prices /path/to/custom.toml ...    (CLI flag)
#   2. ./nous_prices.toml                         (project-local)
#   3. ~/.config/nous/prices.toml                 (user-global)
#   4. <package>/pricing/defaults.toml            (this file)
#
# Run `nous prices show` to see which layer is active.
# Run `nous prices init` to copy this file to your project root.
# Run `nous prices verify <model>` for full cost breakdown.
# Run `nous prices upgrade <file>` to migrate v1.0 -> v2.0.
#
# Schema v2.0 changes vs v1.0:
#   - `input_per_1m_usd`         renamed to `input_per_1m`
#   - `output_per_1m_usd`        renamed to `output_per_1m`
#   - `input_cached_per_1m_usd`  renamed to `input_cached_per_1m`
#   - `input_cache_write_per_1m_usd` renamed to `input_cache_write_per_1m`
#   - `hourly_cost_usd`          renamed to `hourly_cost`
#   - Per-table `_currency` is now authoritative for cost_cap
#     consistency (see Phase 5b release notes).
#
# All decimal values are stored as STRINGS so the TOML parser
# preserves exact rationals. Float would introduce IEEE 754
# rounding (0.1 != 0.1 in binary).
# =====================================================================

_schema_version = "2.0"
_source_url     = "https://www.digitalapplied.com/blog/llm-api-pricing-index-q2-2026-cost-per-token"
# _last_verified is the OLDEST per-model verified_date, not the newest.
# On 2026-09-08 the three Anthropic entries were re-verified from
# https://platform.claude.com/docs/en/about-claude/pricing (15 fields,
# zero divergence) and carry verified_date 2026-09-08. The other nine
# were NOT re-checked and keep 2026-06-29 / 2026-07-07. This field stays
# at the weakest entry deliberately. Only verified_date drives the 90-day
# --smt gate; this one is printed by `nous prices show` and nothing else.
# On 2026-09-17 gpt-5-2, gpt-5-mini, gpt-4o-mini and gemini-3-1-pro were
# re-verified against first-party pages fetched and hashed on Server A;
# each entry's notes name the page and its sha256. _last_verified stays
# at 2026-06-29 because four entries still carry that date.
_last_verified  = "2026-06-29"
_currency       = "USD"


# ---------------------------------------------------------------------
# Anthropic -- Claude family
# ---------------------------------------------------------------------

[models."claude-opus-4-7"]
provider       = "anthropic"
pricing_model  = "per_token"
input_per_1m  = "5.00"
output_per_1m = "25.00"

# Prompt caching: Anthropic charges 10% of input rate for cache hits,
# and 1.25x of input rate on the first call (cache write). Without
# explicit user opt-in, --smt assumes full price (sound upper bound).
prompt_caching_supported = true
input_cached_per_1m      = "0.50"
input_cache_write_per_1m = "6.25"

# Batch API: 50% off both input and output for async workloads (24h SLA).
batch_discount_pct = 50

# Reasoning multiplier: 1.0 means no hidden thinking tokens.
# Increase for o3-class / R1-class models that emit invisible CoT.
reasoning_token_multiplier = "1.0"

verified_date = "2026-09-08"
source_url    = "https://platform.claude.com/docs/en/about-claude/pricing"
verified_by   = "manual"
notes         = "Q2 2026 list price"


[models."claude-opus-4"]
alias_of = "claude-opus-4-7"


