# __session81_serverb_venv_fix_v1__
# Override ExecStart to run uvicorn from the project venv (Python 3.12.13)
# instead of system /usr/bin/python3 (Python 3.10, no tomllib).
# Fixes Server B's degraded /v1/verify-dossier response and any other
# tomllib-dependent code path.
[Service]
ExecStart=
ExecStart=/opt/neuroaether/nous/.venv/bin/uvicorn nous_api:app --host 127.0.0.1 --port 8000 --workers 2
