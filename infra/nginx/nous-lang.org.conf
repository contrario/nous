server {
    listen 80;
    listen [::]:80;
    server_name nous-lang.org www.nous-lang.org;
    return 301 https://nous-lang.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.nous-lang.org;
    ssl_certificate /etc/ssl/nous-lang.org/origin.pem;
    ssl_certificate_key /etc/ssl/nous-lang.org/origin-key.pem;
    return 301 https://nous-lang.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nous-lang.org;

    ssl_certificate /etc/ssl/nous-lang.org/origin.pem;
    ssl_certificate_key /etc/ssl/nous-lang.org/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/nous-lang.org;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /ide {
        rewrite ^ /ide.html last;
    }
    location = /ide.html {
        alias /var/www/nous-lang.org/ide.html;
    }
    location = /playground {
        rewrite ^ /ide.html last;
    }

    # __governance_pages_v1__
    location = /governance {
        rewrite ^ /governance.html last;
    }
    location = /replay {
        rewrite ^ /replay.html last;
    }
    location = /policies {
        rewrite ^ /policies.html last;
    }


    # SSE streaming - no buffering
    location /api/v1/chat/stream {
        proxy_pass http://127.0.0.1:8000/v1/chat/stream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # NOUS API direct (added during recovery 26/4/2026)
    location /v1/ {
        proxy_pass http://127.0.0.1:8000/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # NOUS API
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
    # __s264_verify_offline_gone_v1__
    # The standalone verify_offline.py download was withdrawn (ADR-0009) and
    # the file removed from /var/www. Without this block the SPA fallback
    # below answers 200 with the homepage for this path, so a curl -sLO of
    # it saves an HTML page under a .py name and looks like a successful
    # download. Same defect class as the /.well-known/ carve-out below, on a
    # path two dated blog posts still link to as historical text. 410 and not
    # 404 because the resource existed, was published, and was deliberately
    # removed. Exact match (=) outranks every prefix and every regex
    # location in nginx, so no future block can quietly restore the 200.
    location = /verify_offline.py {
        default_type text/plain;
        return 410 "410 Gone. The standalone verify_offline.py download was withdrawn. Offline verification is dossier-embedded: every NOUS dossier ships the verifier that matches its own evidence. Unpack the dossier and run verify_offline.py from inside it. See https://nous-lang.org/verify.html and docs/adr/ADR-0009-standalone-verifier-withdrawal.md.";
    }

    # __s235_wellknown_404_v1__
    # The published evidence surface must 404 on a missing artifact. The SPA
    # fallback below returns the homepage with 200 for any path it cannot
    # resolve; on /.well-known/ that hands an auditor an HTML page where a
    # signed artifact belongs.
    location /.well-known/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json;
    gzip_min_length 1000;
    gzip_vary on;
}
