name: release

# Production PyPI release workflow (S163 P2). __s163_p2_flip_pypi_v1__ ; from reviewed sha 338eda35.
# Targets pypi.org (production). TestPyPI dry-run was v5.59.0 (S162).
# Reviewed-not-applied. Supersedes all prior release.yml drafts.
# Prerequisites before this can run (all go-gated, IRREVERSIBLE-class):
#   1. PyPI/TestPyPI Trusted Publisher: owner=contrario repo=nous
#      workflow=release.yml environment=pypi (or testpypi for the dry-run).
#   2. GitHub Environment with REQUIRED REVIEWER = operator
#      (operator-control gate: CI cannot publish without your click).
#   3. PIN every action below to a full commit SHA + Dependabot before merge.
#      This workflow holds publish privilege; tag pointers are not acceptable.
#
# HONEST BOUNDARY (corrected S161 -- the cross-environment rebuildable-wheel
# claim was RETIRED after proof: the published 5.58.0 wheel sha 6fdeaf03 did
# not match any local rebuild; setuptools/Python differ from the publisher
# environment, so byte-for-byte reproduction across hosts does NOT hold):
#   - Third-party BUILD verification is the FEDERATION legs, not re-derivation:
#       * PEP 740 publish attestation  -> identity of the publisher
#         (contrario/nous Trusted Publisher), verifiable via the PyPI
#         Integrity API / sigstore-python / pypi-attestations.
#       * actions/attest-build-provenance (SLSA Build L2) -> builder identity,
#         verifiable via `gh attestation verify` / `slsa-verifier`.
#   - The operator-key L1 leg (resign_l1_over_published.py, Server A) EVIDENCES
#     Ed25519 signature + subject (wheel/sdist sha) identity under the offline
#     root. It does NOT assert reproducibility.
#   - SOURCE_DATE_EPOCH + umask below are build HYGIENE (stable output within
#     the runner environment), NOT a cross-environment reproducibility claim.

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0                   # full history + tags: preflight tag check + SDE
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"           # match Server A build minor (3.12.x)
      - name: Install (runtime extras + build + pytest; confirm floor on first dry-run)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[all]'
          python -m pip install pytest build pyflakes  # __s162_p1_pyflakes_added__
      - name: Gate + build + wheel-gate + install-smoke (no provenance, no operator key)
        run: |
          umask 022
          SDE="$(git log -1 --format=%ct "${GITHUB_REF_NAME}")"
          echo "SOURCE_DATE_EPOCH=${SDE} (build hygiene, not a reproducibility claim)"
          SOURCE_DATE_EPOCH="${SDE}" \
            python scripts/release.py --build --no-provenance --allow-existing-tag
      - name: Print digests (operator records the published wheel/sdist sha)
        run: sha256sum dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/nous-lang
    permissions:
      id-token: write        # OIDC: Trusted Publishing + Sigstore attestation identity
      attestations: write    # SLSA build-provenance attestation
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - name: SLSA Build L2 provenance (keyless, Fulcio OIDC, public Rekor)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0 (was @v2; fallback v2.4.0=e8998f949152b193b063cb0ec769d69d929409be)
        with:
          subject-path: "dist/*"
      - name: Publish to PyPI (Trusted Publishing; PEP 740 publish attestation auto)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        with:
          print-hash: true
