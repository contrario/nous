# /run/nous-signer is a tmpfs runtime dir recreated on boot for the UDS socket.
# The durable state (counter.ndjson) lives in /var/lib/nous-signer, NOT here.
# Install: sudo cp nous-signer.tmpfiles.conf /etc/tmpfiles.d/ && sudo systemd-tmpfiles --create
d /run/nous-signer 0700 nous-signer nous-signer -
