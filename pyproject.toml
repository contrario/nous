# __cc_dynamic_block_v1__
[tool.setuptools.dynamic]
version = {attr = "_version.__version__"}

# __templates_package_v1__
[tool.setuptools.package-data]
templates = ["*.nous"]

# __grammar_lark_v1__ — ship nous.lark as installable data-file
# Lives next to top-level py-modules (cli.py, parser.py, etc.) at install-time.
[tool.setuptools.data-files]
"." = ["nous.lark"]
# __cost_cap_phase3b_datafiles_v1__
"pricing" = ["pricing/defaults.toml"]


# __c2_conformance_markers_v1__
[tool.pytest.ini_options]
markers = [
    "offline: hermetic conformance vector; no network, uses committed reference evidence",
    "live: requires a live production TSA; deselected unless --run-live is passed",
]
