[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nous-lang"
# __cc_version_pyproject_v1__
dynamic = ["version"]
description = "NOUS (Νοῦς) — The Living Language for Agentic AI Systems"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Hlias Staurou", email = "support@nous-lang.org"},
]
keywords = ["ai", "agents", "language", "compiler", "evolution", "multi-agent", "soul", "mitosis", "symbiosis", "metabolism", "consciousness"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "lark>=1.1.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "cryptography>=42,<47",  # __session67_cryptography_base_v1__
]

[project.optional-dependencies]
lsp = ["pygls>=1.3.0", "lsprotocol>=2024.0.0"]
server = ["fastapi>=0.104.0", "slowapi>=0.1.9", "uvicorn>=0.24.0"]
# __smt_extra_v1__
smt = ["z3-solver>=4.15.0,<4.17.0"]  # __cost_cap_phase4_smt_extra_v1__ + __session67_cryptography_demoted_v1__
all = ["nous-lang[lsp,server,smt]"]

[project.urls]
Homepage = "https://nous-lang.org"
Repository = "https://github.com/contrario/nous"
Documentation = "https://nous-lang.org/docs"

[project.scripts]
nous = "cli:main"

[tool.setuptools]
packages = ["templates"]
# __cc_pymodule_v1__
py-modules = [
    "_version", "cli", "parser", "ast_nodes", "validator", "typechecker",
    "codegen", "codegen_js", "runtime", "bridge", "nsp",
    "formatter", "profiler", "debugger", "repl", "test_runner",
    "plugin_manager", "registry", "workspace", "import_resolver",
    "cross_world", "error_recovery", "watcher", "watch", "benchmarks",
    "docs_generator", "visualizer", "distributed", "wasm_builder",
    "self_compiler", "compiler_senses", "verifier", "natural_lang",
    "lsp_server", "behavioral_diff", "cost_oracle", "mcp_bridge",
    "migrate_v2",
    "mitosis_engine", "immune_engine", "dream_engine",
    "telemetry_engine", "hot_reload_engine", "symbiosis_engine",
    "metabolism_engine", "consciousness_engine",
    "nous_runtime", "nous_ast_runner",
    "nous_api", "nous_api_server", "grammar_data",
    "sense_registry", "mood_engine",
    "replay_store", "replay_runtime",
    "replay_cli", "risk_engine", "intervention", "governance", "governance_simulator",
    "governance_lint", "stdlib_manager", "phrase_detector",
    "pricing", "cli_prices",  # __cost_cap_phase3b_modules_v1__
    "smt_emit", "cli_emit_smt",  # __cost_cap_phase3c_modules_v1__
    "smt_verify", "manifest", "cli_verify",  # __cost_cap_phase4_modules_v1__
    "dossier", "cli_dossier",  # __session64_dossier_modules_v1__
    "skill_md", "dossier_spec", "cli_dossier_spec",  # __session77_release_v5_1_0_pyproject__
    "skill_export", "cli_skill_export",  # __session77_release_v5_2_0_pyproject__
    "rekor_anchor",  # __session80_release_v5_3_0_pyproject__  # __nous_aetherproof_release_530_packaging_v1__
    "rekor_anchor_v2",  # __session92_rekor_anchor_v2_pyproject_v1__
    "tsa_verify",  # __session92_tsa_verify_pyproject_v1__
    "tsa_client",  # __session92_tsa_client_pyproject_v1__
    "rekor_signing_config",  # __session86_rekor_signing_config_pyproject_v1__
    "rekor_entry",  # __session87_rekor_entry_pyproject_v1__
    "rekor_checkpoint",  # __session87_rekor_checkpoint_pyproject_v1__
    "rekor_verify_v2",  # __session87_rekor_verify_v2_pyproject_v1__
    "offline_verifier_builder",  # __session90_offline_verifier_builder_pymodule_v1__
    "nous_trace",  # __session96_trace_pymodule_v1__
    "trace_recorder",  # __nous_trace_recorder_pymodule_v1__
    "run_shas",  # __nous_run_shas_pymodule_v1__
    "conformance",  # __session96_conformance_pymodule_v1__
    "cli_conformance",  # __session96_cli_conformance_pymodule_v1__
    "cli_verify_sequence",
    "compiled_trace",  # __s105_compiled_trace_pymod_v1__
    "trace_anchor",  # __s105_trace_anchor_pymod_v1__  # __phase2_stage6_pymodule_v1__
    "conformance_verifier",  # __nous_conformance_verifier_pymodule_v1__
]

# __cc_dynamic_block_v1__
[tool.setuptools.dynamic]
version = {attr = "_version.__version__"}

# __templates_package_v1__
[tool.setuptools.package-data]
templates = ["*.nous"]

# __grammar_lark_v1__ — ship nous.lark as installable data-file
# Lives next to top-level py-modules (cli.py, parser.py, etc.) at install-time.
[tool.setuptools.data-files]
"." = ["nous.lark"]
# __cost_cap_phase3b_datafiles_v1__
"pricing" = ["pricing/defaults.toml"]
